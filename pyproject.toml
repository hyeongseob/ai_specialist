[project]
name = "ai-specialist-review"
version = "0.1.0"
description = "AI Specialist 과정 복습용 로컬 환경 (CPU)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "jupyterlab>=4.5.1",
    "ipywidgets>=8.1.8",
    "torch>=2.9.1",
    "torchvision>=0.24.1",
    "numpy",
    "pandas>=2.3.3",
    "matplotlib>=3.10.8",
    "tiktoken>=0.12.0",
    "tqdm>=4.66.5",
    "requests",
    "transformers>=4.57.3",
    "datasets>=4.3.0",
    "gensim",
    "openai>=2.14.0",
    "python-dotenv>=1.2.1",
    "scikit-learn",
]

[tool.uv]
package = false

# GPU가 없으므로 CPU 빌드 torch 사용
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
